name: Deploy dual mdBook site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MDBOOK_VERSION: 0.5.2
      MDBOOK_MERMAID_VERSION: 0.17.0
    steps:
      - uses: actions/checkout@v4

      - name: Install mdBook toolchain once
        run: |
          cargo install --locked --version "${MDBOOK_VERSION}" mdbook
          cargo install --locked --version "${MDBOOK_MERMAID_VERSION}" mdbook-mermaid

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Check both books
        run: python3 scripts/check_book.py

      - name: Compile Rust examples in both books
        run: |
          mdbook test books/rust-hft
          mdbook test books/ai

      - name: Compile standalone C++20 examples
        run: python3 scripts/check_cpp_examples.py --compiler g++ --run

      - name: Assemble portal and both books
        run: |
          test -f portal/index.html
          test -f portal/robots.txt
          mkdir -p site
          cp -a portal/. site/
          mdbook build books/rust-hft --dest-dir "${GITHUB_WORKSPACE}/site/rust-hft"
          mdbook build books/ai --dest-dir "${GITHUB_WORKSPACE}/site/ai"
          python3 scripts/create_legacy_redirects.py "${GITHUB_WORKSPACE}/site"

      - name: Verify noindex and local links
        run: python3 scripts/check_site.py site

      - name: Upload assembled site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
