[book]
authors = ["HFT Engineer"]
language = "zh-CN"
src = "src"
title = "高性能Rust：方法、实现与优化"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
site-url = "/hft-book-rs/"
additional-css = ["theme/custom.css"]
additional-js = ["theme/custom.js", "mermaid.min.js", "mermaid-init.js"]
git-repository-url = "https://github.com/yxz/hft-book-rs"
edit-url-template = "https://github.com/yxz/hft-book-rs/edit/main/{path}"
