[book]
authors = ["AI 学习团队"]
language = "zh-CN"
src = "src"
title = "AI 系统与 Agent Infra 基础宝典"
description = "从 AI 与 LLM 基础，到 PyTorch、GPU、分布式训推、Agent Harness、沙箱运行时与可靠性的中文开发面试宝典"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
site-url = "/hft-book-rs/ai/"
mathjax-support = true
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "theme/custom.js"]
git-repository-url = "https://github.com/xizheyin/hft-book-rs"
edit-url-template = "https://github.com/xizheyin/hft-book-rs/edit/main/books/ai/{path}"
