[book]
authors = ["系统 · Rust · C++ · HFT 学习团队"]
language = "zh-CN"
src = "src"
title = "系统、Rust、C++ 与 HFT 基础宝典"
description = "面向零基础求职者的计算机基础、Rust、C++、传统后端、AI Infra 与 HFT 面试宝典"

[preprocessor.mermaid]
command = "mdbook-mermaid"

[output.html]
site-url = "/hft-book-rs/rust-hft/"
additional-css = ["theme/custom.css"]
additional-js = ["mermaid.min.js", "mermaid-init.js", "theme/custom.js"]
git-repository-url = "https://github.com/xizheyin/hft-book-rs"
edit-url-template = "https://github.com/xizheyin/hft-book-rs/edit/main/books/rust-hft/{path}"
